---
- name: Create VPC in AWS
  hosts: localhost
  gather_facts: no
  vars:
    region: us-east-1
    vpc_cidr: "10.0.0.0/16"
    vpc_name: "ProductionVPC"

  tasks:
    - name: Create a new VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ region }}"
        state: present
      register: vpc

    - name: Tag the VPC
      amazon.aws.ec2_tag:
        region: "{{ region }}"
        resource: "{{ vpc.vpc_id }}"
        tags:
          Name: "{{ vpc_name }}"

    - name: Create an Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc_id }}"
        region: "{{ region }}"
        state: present
      register: igw

    - name: Create a public subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc_id }}"
        cidr: "10.0.1.0/24"
        region: "{{ region }}"
        map_public: yes
        state: present
        tags:
          Name: "PublicSubnet"

    - name: Create a route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc_id }}"
        region: "{{ region }}"
        state: present
      register: route_table

    - name: Associate route table with public subnet
      amazon.aws.ec2_vpc_route_table_assoc:
        subnet_id: "{{ vpc_subnet.subnet_id }}"
        route_table_id: "{{ route_table.route_table_id }}"
        region: "{{ region }}"

    - name: Create a route to the Internet Gateway
      amazon.aws.ec2_vpc_route:
        route_table_id: "{{ route_table.route_table_id }}"
        destination_cidr_block: "0.0.0.0/0"
        gateway_id: "{{ igw.igw_id }}"
        region: "{{ region }}"
        state: present

    - name: Output VPC ID
      debug:
        msg: "VPC created with ID: {{ vpc.vpc_id }}"