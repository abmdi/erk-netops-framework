yaml
---
- name: Install and configure Nginx
  hosts: web_servers
  become: yes
  vars:
    nginx_conf_path: /etc/nginx/nginx.conf

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present
      tags: nginx

    - name: Ensure Nginx service is running
      service:
        name: nginx
        state: started
        enabled: yes
      tags: nginx

    - name: Deploy custom Nginx configuration
      copy:
        src: files/nginx.conf
        dest: "{{ nginx_conf_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart Nginx
      tags: nginx_config

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
