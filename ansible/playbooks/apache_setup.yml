yaml
---
- name: Setup Apache Web Server
  hosts: webservers
  become: yes
  vars:
    apache_packages:
      - apache2

  tasks:
    - name: Ensure Apache is installed
      apt:
        name: "{{ apache_packages }}"
        state: present
        update_cache: yes
      tags: install

    - name: Ensure Apache is started and enabled
      service:
        name: apache2
        state: started
        enabled: yes
      tags:
        - start
        - enable

    - name: Deploy custom index.html
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      tags: deploy

    - name: Open HTTP port in the firewall
      ufw:
        rule: allow
        name: 'Apache Full'
      tags: firewall
