yaml
---
- name: Setup Apache Web Server
  hosts: webservers
  become: yes
  vars:
    apache_packages:
      - httpd
    apache_service: httpd
    document_root: /var/www/html

  tasks:
    - name: Install Apache packages
      yum:
        name: "{{ apache_packages }}"
        state: present
      tags: apache
    
    - name: Start and enable Apache service
      systemd:
        name: "{{ apache_service }}"
        state: started
        enabled: yes
      tags: apache

    - name: Ensure document root directory exists
      file:
        path: "{{ document_root }}"
        state: directory
        owner: apache
        group: apache
        mode: '0755'
      tags: apache

    - name: Deploy a basic index.html
      copy:
        dest: "{{ document_root }}/index.html"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to Apache!</title>
          </head>
          <body>
              <h1>Success! The Apache server is configured.</h1>
          </body>
          </html>
        owner: apache
        group: apache
        mode: '0644'
      tags: apache

    - name: Open HTTP service in the firewall
      firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes
      tags: apache
