yaml
---
- name: Setup Nginx Web Server
  hosts: web_servers
  become: yes
  vars:
    nginx_service: nginx
    nginx_config_path: /etc/nginx/nginx.conf

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: "{{ nginx_service }}"
        state: present
        update_cache: yes
      tags: install

    - name: Start and enable Nginx service
      systemd:
        name: "{{ nginx_service }}"
        state: started
        enabled: true
      tags: service

    - name: Configure Nginx
      blockinfile:
        path: "{{ nginx_config_path }}"
        block: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              root /var/www/html;
              index index.html index.htm;
              server_name _;
              location / {
                  try_files $uri $uri/ =404;
              }
          }
      notify: Restart Nginx
      tags: config

  handlers:
    - name: Restart Nginx
      systemd:
        name: "{{ nginx_service }}"
        state: restarted

  post_tasks:
    - name: Ensure UFW allows Nginx HTTP traffic
      ufw:
        rule: allow
        name: "Nginx Full"
      tags: firewall
