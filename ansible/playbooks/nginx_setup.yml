yaml
---
- name: Setup Nginx Web Server
  hosts: web_servers
  become: yes
  vars:
    nginx_package: nginx
    web_root: /var/www/html
    index_file: index.html

  tasks:
    # Update the package manager cache
    - name: Update apt cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    # Ensure Nginx is installed
    - name: Install Nginx
      apt:
        name: "{{ nginx_package }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Nginx
      yum:
        name: "{{ nginx_package }}"
        state: present
      when: ansible_os_family == "RedHat"

    # Start and enable Nginx service
    - name: Ensure Nginx is running and enabled
      service:
        name: "{{ nginx_package }}"
        state: started
        enabled: yes

    # Deploy a simple index.html to the web root
    - name: Create index.html
      copy:
        dest: "{{ web_root }}/{{ index_file }}"
        content: |
          <html>
          <head>
              <title>Welcome to Nginx!</title>
          </head>
          <body>
              <h1>Hello from Nginx on {{ ansible_hostname }}!</h1>
          </body>
          </html>

    # Open HTTP port in firewall if present
    - name: Open HTTP port in firewall (Debian)
      ufw:
        rule: allow
        name: "Nginx HTTP"
      when: ansible_os_family == "Debian"

    - name: Open HTTP port in firewall (RedHat)
      firewalld:
        service: http
        permanent: yes
        state: enabled
      when: ansible_os_family == "RedHat"
      notify:
        - reload firewalld

  handlers:
    - name: reload firewalld
      service:
        name: firewalld
        state: reloaded
