yaml
---
- name: Setup Nginx on Ubuntu Server
  hosts: webservers
  become: yes
  vars:
    nginx_package: nginx
    nginx_service: nginx

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: "{{ nginx_package }}"
        state: present
        update_cache: yes
      tags: nginx

    - name: Configure Nginx to start on boot
      systemd:
        name: "{{ nginx_service }}"
        enabled: yes
      tags: nginx

    - name: Start Nginx service
      systemd:
        name: "{{ nginx_service }}"
        state: started
      tags: nginx

    - name: Ensure Nginx configuration directory exists
      file:
        path: /etc/nginx/conf.d
        state: directory
      tags: nginx

    - name: Deploy custom Nginx configuration
      copy:
        src: files/custom_nginx.conf
        dest: /etc/nginx/conf.d/custom_nginx.conf
      notify:
        - Restart Nginx
      tags: nginx

  handlers:
    - name: Restart Nginx
      systemd:
        name: "{{ nginx_service }}"
        state: restarted
      tags: nginx
