---
- name: Configure Nginx on Ubuntu server
  hosts: web_servers
  become: yes
  vars:
    nginx_package: nginx
    nginx_service: nginx
    nginx_conf_file: /etc/nginx/nginx.conf
    nginx_default_site: /etc/nginx/sites-available/default

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: "{{ nginx_package }}"
        state: present
        update_cache: yes

    - name: Ensure Nginx service is enabled and started
      service:
        name: "{{ nginx_service }}"
        state: started
        enabled: yes

    - name: Backup default Nginx configuration file
      copy:
        src: "{{ nginx_default_site }}"
        dest: "{{ nginx_default_site }}.bak"
        remote_src: yes
        force: no
      notify:
        - Reload Nginx

    - name: Configure Nginx to serve custom content
      lineinfile:
        path: "{{ nginx_conf_file }}"
        regexp: '^#?server_names_hash_bucket_size'
        line: 'server_names_hash_bucket_size 64;'
        state: present
      notify:
        - Reload Nginx

  handlers:
    - name: Reload Nginx
      service:
        name: "{{ nginx_service }}"
        state: reloaded