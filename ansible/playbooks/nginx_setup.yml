yaml
---
- name: Configure Nginx on Ubuntu servers
  hosts: webservers
  become: yes
  vars:
    nginx_listen_port: 80
    nginx_server_name: localhost

  tasks:
    # Update and upgrade apt packages
    - name: Ensure apt packages are up to date
      apt:
        update_cache: yes
        upgrade: dist

    # Install Nginx package
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    # Ensure Nginx service is enabled and started
    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    # Configure Nginx to listen on specified port and server name
    - name: Configure Nginx to listen on specified port
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: 
        - Restart Nginx

  handlers:
    # Handler to restart Nginx service upon configuration change
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
```

Note: Ensure that the `templates/nginx.conf.j2` file exists and is properly configured to use the `nginx_listen_port` and `nginx_server_name` variables.