---
- name: Configure Nginx Web Server
  hosts: web_servers
  become: yes
  vars:
    nginx_package: nginx
    default_index_file: /var/www/html/index.html

  tasks:
    # Ensure the Nginx package is installed
    - name: Install Nginx
      apt:
        name: "{{ nginx_package }}"
        state: present
        update_cache: yes

    # Ensure the Nginx service is running and enabled on boot
    - name: Ensure Nginx is running
      service:
        name: "{{ nginx_package }}"
        state: started
        enabled: yes

    # Create a custom index.html file
    - name: Create index.html
      copy:
        dest: "{{ default_index_file }}"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to Nginx!</title>
          </head>
          <body>
              <h1>Success! The Nginx web server is installed and working!</h1>
          </body>
          </html>
      owner: www-data
      group: www-data
      mode: '0644'

    # Open HTTP port in the firewall
    - name: Allow HTTP through the firewall
      ufw:
        rule: allow
        name: 'Nginx HTTP'
        port: '80'
        proto: 'tcp'
