---
- name: Configure Nginx on Ubuntu Servers
  hosts: web_servers
  become: true  # Elevate privilege to install and configure software
  vars:
    nginx_conf_path: /etc/nginx/sites-available/default

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present
        update_cache: yes  # Update package database before installing

    - name: Ensure Nginx is running and enabled on boot
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Configure Nginx
      template:
        src: templates/nginx.j2  # Jinja2 template for Nginx configuration
        dest: "{{ nginx_conf_path }}"
        owner: root
        group: root
        mode: '0644'

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      failed_when: "'successful' not in nginx_test.stdout"  # Ensure config test passes

    - name: Reload Nginx to apply changes
      systemd:
        name: nginx
        state: reloaded
      when: "'successful' in nginx_test.stdout"  # Reload only if config test was successful

  handlers:
    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted
---