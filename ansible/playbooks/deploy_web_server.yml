---
- name: Deploy Web Server on Ubuntu
  hosts: web_servers
  become: yes
  vars:
    # Define the package to be installed
    web_package: apache2
    # Define the service name
    web_service: apache2

  tasks:
    - name: Ensure the latest version of the package index is installed
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install web server package
      apt:
        name: "{{ web_package }}"
        state: present

    - name: Ensure web service is enabled and started
      service:
        name: "{{ web_service }}"
        state: started
        enabled: yes

    - name: Create a simple HTML file
      copy:
        dest: /var/www/html/index.html
        content: "<html><body><h1>Welcome to the Web Server</h1></body></html>"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Open HTTP port in UFW firewall
      ufw:
        rule: allow
        port: '80'
        proto: tcp
        comment: Allow HTTP traffic

    - name: Ensure UFW is enabled
      ufw:
        state: enabled
        policy: allow
        logging: on