yaml
---
- name: Deploy and configure a web server on Ubuntu
  hosts: web_servers
  become: yes
  vars:
    # Define variables for package and service
    web_package: apache2
    web_service: apache2

  tasks:
    - name: Ensure web server package is installed
      apt:
        name: "{{ web_package }}"
        state: present
        update_cache: yes

    - name: Ensure web server service is running
      service:
        name: "{{ web_service }}"
        state: started
        enabled: yes

    - name: Deploy default index.html
      copy:
        content: "<html><body><h1>Welcome to the web server!</h1></body></html>"
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Open firewall for HTTP
      ufw:
        rule: allow
        name: 'Apache Full'
        state: enabled

    - name: Verify web server is running
      uri:
        url: http://localhost
        status_code: 200
      register: http_response

    - name: Display web server response
      debug:
        msg: "Web server is running, received response: {{ http_response.content }}"
