---
- name: Deploy Secure Web Server
  hosts: web_servers
  become: yes
  vars:
    http_port: 80
    https_port: 443
    server_admin: admin@example.com
    document_root: /var/www/html

  tasks:
    # Ensure Apache is installed
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    # Ensure the firewall allows traffic on HTTP and HTTPS
    - name: Ensure UFW allows HTTP and HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
    with_items:
      - "{{ http_port }}"
      - "{{ https_port }}"

    # Set up the document root
    - name: Ensure document root directory exists
      file:
        path: "{{ document_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    # Deploy a basic HTML page
    - name: Deploy index.html
      copy:
        content: "<html><h1>Welcome to the Secure Web Server</h1></html>"
        dest: "{{ document_root }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    # Enable and start Apache service
    - name: Ensure Apache is enabled and running
      service:
        name: apache2
        state: started
        enabled: true

    # Install SSL module and generate a self-signed certificate
    - name: Install SSL Module
      apt:
        name: ssl-cert
        state: present

    - name: Enable SSL Module in Apache
      command: a2enmod ssl

    - name: Generate self-signed SSL certificate
      openssl_certificate:
        path: /etc/ssl/certs/ssl-cert-snakeoil.pem
        privatekey_path: /etc/ssl/private/ssl-cert-snakeoil.key
        common_name: "{{ ansible_fqdn }}"
        state: present

    - name: Ensure Apache SSL configuration is enabled
      command: a2ensite default-ssl
      notify: restart apache

  handlers:
    - name: restart apache
      service:
        name: apache2
        state: restarted