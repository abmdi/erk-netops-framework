- name: Deploy a web server on Ubuntu
  hosts: web_servers
  become: true
  vars:
    http_port: 80
  tasks:
    # Update package index
    - name: Update apt cache
      apt:
        update_cache: yes

    # Ensure Apache is installed
    - name: Install Apache
      apt:
        name: apache2
        state: present

    # Ensure Apache service is enabled and running
    - name: Ensure Apache is enabled and running
      service:
        name: apache2
        state: started
        enabled: true

    # Configure UFW to allow HTTP traffic
    - name: Allow HTTP traffic through UFW
      ufw:
        rule: allow
        port: "{{ http_port }}"
        proto: tcp

    # Ensure the default Apache index page is deployed
    - name: Deploy default Apache index page
      copy:
        content: "<html><body><h1>Welcome to the web server!</h1></body></html>"
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'