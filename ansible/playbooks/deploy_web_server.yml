---
- name: Deploy and configure a secure web server
  hosts: web_servers
  become: yes
  vars:
    http_port: 80
    https_port: 443
    server_admin: admin@example.com
  tasks:
    - name: Ensure Apache is installed
      ansible.builtin.yum:
        name: httpd
        state: present

    - name: Start and enable Apache service
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes

    - name: Install firewalld
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Start and enable firewalld service
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow HTTP and HTTPS through the firewall
      ansible.builtin.firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
      loop:
        - http
        - https

    - name: Reload firewalld to apply changes
      ansible.builtin.firewalld:
        state: reloaded

    - name: Ensure mod_ssl is installed for HTTPS
      ansible.builtin.yum:
        name: mod_ssl
        state: present

    - name: Deploy custom index.html
      ansible.builtin.copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'

    - name: Set server admin in Apache configuration
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^ServerAdmin'
        line: "ServerAdmin {{ server_admin }}"
        state: present

    - name: Restart Apache to apply changes
      ansible.builtin.service:
        name: httpd
        state: restarted