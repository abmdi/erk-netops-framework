yaml
---
- name: Deploy and configure web server
  hosts: web_servers
  become: yes
  vars:
    http_port: 80
    document_root: /var/www/html

  tasks:
    # Ensure Apache is installed
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    # Ensure the Apache service is enabled and started
    - name: Ensure Apache is running
      service:
        name: apache2
        state: started
        enabled: yes

    # Copy the web content to the document root
    - name: Deploy web content
      copy:
        src: files/index.html
        dest: "{{ document_root }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    # Configure the firewall to allow HTTP traffic
    - name: Allow HTTP traffic through UFW
      ufw:
        rule: allow
        port: "{{ http_port }}"
        proto: tcp

  handlers:
    # Restart Apache to apply any changes
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
