- name: Deploy and configure a secure web server
  hosts: web_servers
  become: yes
  vars:
    http_port: 80
    https_port: 443
    server_admin: admin@example.com

  tasks:
    # Install necessary packages
    - name: Ensure Apache is installed
      ansible.builtin.yum:
        name: httpd
        state: present

    # Start and enable Apache service
    - name: Ensure httpd is started and enabled
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes

    # Setup firewall rules for HTTP and HTTPS
    - name: Open firewall for HTTP and HTTPS
      ansible.builtin.firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
      loop:
        - http
        - https
      notify: restart firewall

    # Configure SELinux for HTTPD
    - name: Allow HTTPD and HTTPSD through SELinux
      ansible.builtin.command: setsebool -P httpd_can_network_connect 1

    # Deploy a basic HTML page
    - name: Deploy index.html
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to Your Secure Web Server</title>
          </head>
          <body>
              <h1>Hello, World!</h1>
              <p>This is a secure web server managed by Ansible.</p>
          </body>
          </html>

  handlers:
    # Restart firewall in case of changes
    - name: restart firewall
      ansible.builtin.service:
        name: firewalld
        state: restarted