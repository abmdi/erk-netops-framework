---
- name: Deploy Web Server
  hosts: webservers
  become: yes
  vars:
    # Define variables for the web server
    web_user: www-data
    web_group: www-data
    web_root: /var/www/html
    package_list:
      - apache2
      - php
      - libapache2-mod-php

  tasks:
    - name: Ensure the Apache web server is installed
      apt:
        name: "{{ package_list }}"
        state: present
        update_cache: yes

    - name: Start and enable the Apache service
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create web root directory
      file:
        path: "{{ web_root }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: '0755'

    - name: Deploy a sample index.php file
      copy:
        dest: "{{ web_root }}/index.php"
        content: |
          <?php
          echo "Hello, World!";
          ?>
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: '0644'

    - name: Open HTTP port in the firewall
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Ensure UFW is enabled
      ufw:
        state: enabled
...