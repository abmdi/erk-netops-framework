yaml
---
- name: Configure Nginx on Ubuntu server
  hosts: web_servers
  become: yes  # Run tasks with sudo privileges
  vars:
    nginx_user: www-data  # Default user for Nginx
    nginx_worker_processes: auto  # Automatically determine the number of worker processes
    nginx_worker_connections: 1024  # Maximum number of simultaneous connections per worker
  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx  # Package to install
        state: present  # Ensure the package is installed
        update_cache: yes  # Update the apt cache before installing

    - name: Start and enable Nginx service
      systemd:
        name: nginx  # Name of the service
        state: started  # Ensure the service is running
        enabled: yes  # Enable the service to start at boot

    - name: Configure Nginx
      template:
        src: templates/nginx.conf.j2  # Template source file
        dest: /etc/nginx/nginx.conf  # Destination configuration file
        owner: root  # File owner
        group: root  # File group
        mode: '0644'  # File permissions
      notify:  # Trigger handlers if this task makes changes
        - Reload Nginx

  handlers:
    - name: Reload Nginx
      systemd:
        name: nginx  # Name of the service
        state: reloaded  # Reload the service to apply new configuration
```

```jinja
# Content of templates/nginx.conf.j2
user {{ nginx_user }};
worker_processes {{ nginx_worker_processes }};
events {
    worker_connections {{ nginx_worker_connections }};
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}
