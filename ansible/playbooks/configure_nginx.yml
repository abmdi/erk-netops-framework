---
- name: Configure Nginx on Ubuntu
  hosts: webservers
  become: yes
  vars:
    nginx_package: nginx
    default_index_file: /var/www/html/index.nginx-debian.html

  tasks:

    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist
      tags: ['setup']

    - name: Install Nginx
      apt:
        name: "{{ nginx_package }}"
        state: present
      tags: ['nginx']

    - name: Ensure Nginx service is running
      service:
        name: "{{ nginx_package }}"
        state: started
        enabled: yes
      tags: ['nginx']

    - name: Create custom index.html
      copy:
        dest: "{{ default_index_file }}"
        content: |
          <html>
          <head><title>Welcome to Nginx!</title></head>
          <body>
          <h1>Success! The Nginx server is working!</h1>
          </body>
          </html>
      tags: ['nginx']

    - name: Allow HTTP traffic through UFW
      ufw:
        rule: allow
        name: 'Nginx Full'
      tags: ['firewall']
---