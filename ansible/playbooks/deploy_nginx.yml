yaml
---
- name: Deploy Nginx on Ubuntu Servers
  hosts: web_servers
  become: yes
  vars:
    nginx_pkg_name: nginx
    nginx_service_name: nginx

  tasks:
    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist
      tags: [update]

    - name: Install Nginx
      apt:
        name: "{{ nginx_pkg_name }}"
        state: present
      tags: [install]

    - name: Start and enable Nginx service
      systemd:
        name: "{{ nginx_service_name }}"
        state: started
        enabled: yes
      tags: [service]

    - name: Ensure Nginx is listening on port 80
      lineinfile:
        path: /etc/nginx/sites-available/default
        regexp: 'listen 80;'
        line: 'listen 80 default_server;'
      notify: Restart Nginx
      tags: [configuration]

  handlers:
    - name: Restart Nginx
      systemd:
        name: "{{ nginx_service_name }}"
        state: restarted
