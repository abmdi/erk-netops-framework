yaml
---
- name: Deploy Nginx web server
  hosts: web_servers
  become: yes
  vars:
    nginx_package: nginx
    service_name: nginx

  tasks:
    - name: Update and upgrade APT packages
      apt:
        update_cache: yes
        upgrade: dist
      tags: update

    - name: Install Nginx package
      apt:
        name: "{{ nginx_package }}"
        state: present
      tags: install

    - name: Start and enable Nginx service
      systemd:
        name: "{{ service_name }}"
        state: started
        enabled: yes
      tags: service

    - name: Ensure UFW allows HTTP traffic
      ufw:
        rule: allow
        name: "WWW"
        port: "80"
        proto: "tcp"
      tags: firewall

    - name: Verify Nginx is running
      command: systemctl status nginx
      register: nginx_status
      changed_when: false

    - name: Print Nginx status
      debug:
        msg: "Nginx is {{ 'running' if 'running' in nginx_status.stdout else 'not running' }}"

