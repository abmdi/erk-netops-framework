---
- name: Deploy and configure Nginx on Ubuntu
  hosts: web_servers
  become: yes
  vars:
    nginx_package: nginx
    nginx_service: nginx
    nginx_config_path: /etc/nginx/nginx.conf
    custom_index_path: /var/www/html/index.html

  tasks:
    # Update and upgrade apt packages
    - name: Update apt package list
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all apt packages
      apt:
        upgrade: dist
        autoremove: yes

    # Install Nginx package
    - name: Install Nginx
      apt:
        name: "{{ nginx_package }}"
        state: present

    # Ensure Nginx service is enabled and started
    - name: Ensure Nginx is running
      service:
        name: "{{ nginx_service }}"
        state: started
        enabled: yes

    # Configure Nginx with a custom index page
    - name: Create custom index.html
      copy:
        dest: "{{ custom_index_path }}"
        content: |
          <html>
          <head><title>Welcome to Nginx</title></head>
          <body><h1>Welcome to Nginx Server</h1></body>
          </html>

    # Ensure Nginx configuration is valid
    - name: Validate Nginx configuration
      command: nginx -t
      notify: Reload Nginx

  handlers:
    # Handler to reload Nginx when configuration changes
    - name: Reload Nginx
      service:
        name: "{{ nginx_service }}"
        state: reloaded