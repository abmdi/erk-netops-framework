apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: {{ .Values.replicaCount }} # Set the number of replicas
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}" # Use specified image and tag
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "{{ .Values.resources.requests.cpu }}" # CPU request for the container
            memory: "{{ .Values.resources.requests.memory }}" # Memory request for the container
          limits:
            cpu: "{{ .Values.resources.limits.cpu }}" # CPU limit for the container
            memory: "{{ .Values.resources.limits.memory }}" # Memory limit for the container
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d # Mount config volume to nginx conf directory
      volumes:
      - name: config-volume
        configMap:
          name: nginx-configmap # Reference to the ConfigMap for nginx configuration